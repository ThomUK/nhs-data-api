id: rtt
title: Consultant-led Referral to Treatment (RTT) Waiting Times
status: draft
summary: >
  Monthly counts of patients on consultant-led elective care pathways in England, by provider,
  commissioner and treatment function, split into weekly waiting-time bands. Covers the open
  waiting list (incomplete pathways), completed pathways and new clock starts.
publisher: NHS England
source_page: https://www.england.nhs.uk/statistics/statistical-work-areas/rtt-waiting-times/
licence:
  name: Open Government Licence v3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
attribution: "Source: NHS England, Consultant-led Referral to Treatment Waiting Times. Contains public sector information licensed under the Open Government Licence v3.0."
frequency: monthly
geography: England
coverage_start: 2007-03-01
grain: [period, provider_org_code, commissioner_org_code, rtt_part_type, treatment_function_code, weeks_band]

dimensions:
  - id: period
    label: Reporting month
    description: Calendar month the snapshot or activity relates to, as the first day of the month (ISO date).
  - id: provider_org_code
    label: Provider organisation
    description: ODS code of the organisation providing treatment (usually an NHS trust or independent sector provider).
  - id: provider_parent_org_code
    label: Provider parent organisation
    description: ODS code of the provider's parent (region/ICB hierarchy as published).
  - id: commissioner_org_code
    label: Commissioner organisation
    description: ODS code of the commissioner (ICB sub-location, formerly CCG).
  - id: commissioner_parent_org_code
    label: Commissioner parent organisation
    description: ODS code of the commissioner's parent (ICB).
  - id: rtt_part_type
    label: Pathway type
    description: Which RTT return the row comes from.
    codes:
      Part_1A: Completed admitted pathways (clock stopped on admission for treatment)
      Part_1B: Completed non-admitted pathways (clock stopped without admission)
      Part_2: Incomplete pathways (patients still waiting at month end; the waiting list)
      Part_2A: Incomplete pathways with a decision to admit
      Part_3: New RTT periods (clock starts in the month)
  - id: treatment_function_code
    label: Treatment function
    description: Specialty grouping. Published as a subset of treatment function codes plus "Other" groupings and a total. The set changed in 2021 (expanded list); see caveats.
  - id: weeks_band
    label: Waiting-time band
    description: >
      Weeks waited, as a half-open interval (weeks_lower, weeks_upper]. The final band is
      open-ended (more than 104 weeks in current files). Two special bands have no weeks:
      "unknown_clock_start" (completed pathways Part_1A/1B only) and "unbanded" (Part_3 new
      RTT periods, which are published as a single total with no waiting-time split).

views:
  - id: national
    label: England
    group_by: null
    description: All providers and commissioners in England (org_code ENG).
  - id: provider
    label: Provider
    group_by: provider_org_code
    description: Where patients are treated. One row per provider (NHS trust or independent sector provider).
  - id: provider_icb
    label: Provider's ICB
    group_by: provider_parent_org_code
    description: Providers grouped by their parent ICB as published. Answers "how are the providers in this ICB doing?".
  - id: population_icb
    label: Population (ICB)
    group_by: commissioner_parent_org_code
    description: >
      Patients grouped by the ICB responsible for commissioning their care, wherever they are
      treated. Answers "how long are this ICB's residents waiting?". Includes patients treated
      by providers outside the ICB, and excludes other ICBs' patients treated inside it.
      Care commissioned directly by NHS England (for example specialised commissioning hubs)
      has no parent ICB and is grouped under org_code NHSE.
  - id: population_sub_icb
    label: Population (sub-ICB location)
    group_by: commissioner_org_code
    description: As population_icb, at sub-ICB location (former CCG) level.

measures:
  # --- Waiting list size (Part_2, Part_2A) ---
  - id: waiting_list_total
    label: Total waiting list (incomplete pathways)
    unit: count
    aggregation: sum
    definition: Patients waiting to start treatment at month end. Sum of Part_2 across all weekly bands.
    caveat: >
      Sum of submitted data only. NHS England's national headline may include estimates for
      organisations that did not submit, so it can be higher.
  - id: waiting_list_dta
    label: Waiting with a decision to admit
    unit: count
    aggregation: sum
    definition: Incomplete pathways where a decision to admit for treatment has been made (Part_2A).
  - id: pct_waiting_list_dta
    label: Share of the waiting list awaiting admission
    unit: percent
    aggregation: ratio (recompute from components)
    definition: waiting_list_dta / waiting_list_total x 100.

  # --- Waiting times (Part_2 bands) ---
  - id: pct_within_18_weeks
    label: Percentage waiting 18 weeks or less
    unit: percent
    aggregation: ratio (recompute from components; never average)
    definition: Part_2 patients in bands with weeks_upper <= 18, divided by waiting_list_total, x 100.
    standard: NHS Constitution operational standard of 92%.
    status: draft
    caveat: Method to be verified against NHS England headline figures before release.
  - id: waiting_over_18_weeks
    label: Waiting more than 18 weeks
    unit: count
    aggregation: sum
    definition: Part_2 patients in bands with weeks_lower >= 18.
  - id: waiting_over_52_weeks
    label: Waiting more than 52 weeks
    unit: count
    aggregation: sum
    definition: Part_2 patients in bands with weeks_lower >= 52.
  - id: waiting_over_65_weeks
    label: Waiting more than 65 weeks
    unit: count
    aggregation: sum
    definition: Part_2 patients in bands with weeks_lower >= 65.
  - id: waiting_over_78_weeks
    label: Waiting more than 78 weeks
    unit: count
    aggregation: sum
    definition: Part_2 patients in bands with weeks_lower >= 78.
  - id: waiting_over_104_weeks
    label: Waiting more than 104 weeks
    unit: count
    aggregation: sum
    definition: Part_2 patients in the open-ended top band (more than 104 weeks).
  - id: median_wait_weeks
    label: Median wait (weeks)
    unit: weeks
    aggregation: not additive (recompute from band counts)
    definition: >
      50th percentile of the Part_2 waiting-time distribution, by linear interpolation within
      the weekly band containing the median patient.
    status: draft
    caveat: Method to be verified against NHS England published medians.
  - id: p92_wait_weeks
    label: 92nd percentile wait (weeks)
    unit: weeks
    aggregation: not additive (recompute from band counts)
    definition: >
      92nd percentile of the Part_2 waiting-time distribution, interpolated as for the median.
      If it falls in the open-ended top band, the band's lower bound (104) is returned.
    status: draft
    caveat: Method to be verified against NHS England published 92nd percentiles.
  - id: approaching_52_weeks
    label: Approaching 52 weeks
    unit: count
    aggregation: sum
    definition: >
      Part_2 patients waiting more than 40 and up to 52 weeks. Will exceed 52 weeks within 12
      weeks unless treated or removed.

  # --- Flow (Part_1A, Part_1B, Part_3) ---
  - id: clock_starts
    label: New RTT periods (clock starts)
    unit: count
    aggregation: sum
    definition: Pathways starting in the month (Part_3). Published as a total with no waiting-time split.
  - id: clock_stops_admitted
    label: Completed pathways, admitted
    unit: count
    aggregation: sum
    definition: Pathways ending with admission for treatment in the month (Part_1A), including unknown clock start.
  - id: clock_stops_non_admitted
    label: Completed pathways, non-admitted
    unit: count
    aggregation: sum
    definition: Pathways ending in the month without admission (Part_1B), including unknown clock start.
  - id: clock_stops_total
    label: Completed pathways, total
    unit: count
    aggregation: sum
    definition: clock_stops_admitted + clock_stops_non_admitted.
  - id: pct_completed_within_18_weeks_admitted
    label: Admitted pathways completed within 18 weeks
    unit: percent
    aggregation: ratio (recompute from components)
    definition: Part_1A patients in bands with weeks_upper <= 18, divided by Part_1A with a known clock start, x 100.
  - id: pct_completed_within_18_weeks_non_admitted
    label: Non-admitted pathways completed within 18 weeks
    unit: percent
    aggregation: ratio (recompute from components)
    definition: As above for Part_1B.
  - id: median_wait_completed_admitted_weeks
    label: Median wait of admitted completed pathways (weeks)
    unit: weeks
    aggregation: not additive
    definition: Median of the Part_1A distribution (known clock starts), interpolated within weekly bands.
    status: draft
  - id: median_wait_completed_non_admitted_weeks
    label: Median wait of non-admitted completed pathways (weeks)
    unit: weeks
    aggregation: not additive
    definition: Median of the Part_1B distribution (known clock starts), interpolated within weekly bands.
    status: draft

  # --- Month-on-month ---
  - id: waiting_list_change_mom
    label: Change in waiting list since previous month
    unit: count
    aggregation: sum
    requires_previous_month: true
    definition: >
      waiting_list_total minus the previous month's, as published. Null if the previous month
      is not loaded or the organisation/specialty does not appear in it.
    caveat: >
      Affected by providers missing a submission or being recoded. Use
      waiting_list_change_mom_like_for_like to see the underlying change.
  - id: waiting_over_52_weeks_change_mom
    label: Change in 52+ week waiters since previous month
    unit: count
    aggregation: sum
    requires_previous_month: true
    definition: waiting_over_52_weeks minus the previous month's, as published.
    caveat: Affected by missing submissions and recoding; see the like-for-like version.
  - id: waiting_list_change_mom_like_for_like
    label: Change in waiting list since previous month, like-for-like providers
    unit: count
    aggregation: sum
    requires_previous_month: true
    definition: >
      Change in waiting_list_total counting only providers that submitted in both months.
    caveat: >
      Providers recoded under a new ODS code are treated as different providers until ODS
      successor mapping is applied.
  - id: waiting_over_52_weeks_change_mom_like_for_like
    label: Change in 52+ week waiters since previous month, like-for-like providers
    unit: count
    aggregation: sum
    requires_previous_month: true
    definition: Change in waiting_over_52_weeks counting only providers that submitted in both months.
  - id: unexplained_removals
    label: Removals not explained by completed pathways (experimental)
    unit: count
    aggregation: sum
    status: experimental
    requires_previous_month: true
    definition: >
      Previous month's waiting list + clock_starts - clock_stops_total - this month's waiting
      list, counting only providers that submitted in both months. A positive value means the
      list fell by more than recorded treatment explains.
    caveat: >
      Experimental and easily misread. Reflects validation removals (patients who no longer
      need treatment, duplicates), pathways that start and stop within the month, transfers
      between organisations and data quality. It is not a count of patients removed without
      treatment. Most meaningful at national and ICB level, and for trends rather than single
      months.

  # --- Data quality ---
  - id: providers_submitting
    label: Providers submitting
    unit: count
    aggregation: count distinct
    definition: Number of providers with any rows in the group for the month.
  - id: new_non_submitters
    label: New non-submitters
    unit: list of organisations
    aggregation: not applicable
    computed: false
    definition: >
      Providers that appear in the previous month but not this month (from /v1/rtt/submissions).
      Usually indicates a missed submission, a merger or a closure; check ODS before assuming
      missing data.

caveats:
  - id: rtt-independent-sector
    applies_to: all
    text: >
      Independent sector providers appear as providers in their own right. Totals by NHS
      trust exclude NHS-funded activity delivered by independent providers unless they are
      included explicitly.
  - id: rtt-revisions
    applies_to: all
    text: >
      Figures can be revised in later publications. This API keeps every vintage; the
      default view returns the latest revised figure. Use the as_published view for the
      figure as first released.
  - id: rtt-non-submission
    applies_to: all
    text: >
      Some organisations do not submit for some months (for example after an electronic
      patient record go-live). Missing data are not zeros; national totals in the source may
      include estimates for non-submitters. Organisation-month caveats are listed here as
      they are identified.

file_layout_notes:
  - verified: 2026-11-17
    files: [RTT August 2026 full extract, RTT September 2026 full extract]
    note: >
      121 columns: 13 identifiers, 105 weekly bands (0-1 ... 103-104, >104), Total,
      Patients with unknown clock start date, Total All. Part_1A/1B populate bands and Total,
      sometimes unknown clock start; Total All = Total + unknown. Part_2/2A populate bands
      only; Total and unknown are blank; Total All = sum of bands. Part_3 populates Total All
      only. Blank cells mean "not applicable", not zero. Rows are at provider x commissioner x
      treatment function grain; C_999 is the all-specialties total.

known_format_changes:
  - date: 2021-04-01
    note: Treatment function list expanded; earlier "Other" groupings not directly comparable. (To verify.)
