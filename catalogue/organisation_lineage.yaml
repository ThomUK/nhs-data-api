# Organisation lineage links that ODS does not record as successions.
#
# ODS successor records (for example North Bristol NHS Trust RVJ -> RA7 from 2026-07-01) are
# applied automatically. Links here cover cases such as a change of operator, where ODS
# issues new site codes without a successor record. Only `status: confirmed` links are
# applied; `proposed` links are shown on the admin site for review.
#
# Applied links affect like-for-like month-on-month measures and submission checks only.
# Published figures are always reported under the code the publisher used.

