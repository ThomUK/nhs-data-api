# nginx site for the API. Copy to /etc/nginx/sites-available/nhs-data-api.conf, replace
# api.YOUR-DOMAIN.uk, symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.
# Requires nginx >= 1.25.1 for `http2 on;` (older: use `listen 443 ssl http2;` instead).

server {
    listen 80;
    listen [::]:80;
    server_name api.YOUR-DOMAIN.uk;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.YOUR-DOMAIN.uk;

    # Let's Encrypt (certbot), or a Cloudflare origin certificate
    ssl_certificate     /etc/letsencrypt/live/api.YOUR-DOMAIN.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.YOUR-DOMAIN.uk/privkey.pem;

    # Real client IPs from Cloudflare (generated by deploy/nginx/update-cloudflare-ips.sh)
    include /etc/nginx/snippets/cloudflare.conf;
    # Refuse connections that bypass Cloudflare (its cache and rate limits). Enable once the
    # domain is proxied through Cloudflare:
    # if ($from_cloudflare = 0) { return 403; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 1k;   # read-only API

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
